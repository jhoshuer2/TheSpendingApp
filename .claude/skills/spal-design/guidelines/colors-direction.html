<!-- @dsCard group="Colors" viewport="700x170" name="Direction" subtitle="Color says which way money moved — on text and glyphs, never as fills" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--surface-app);color:var(--text-primary);font-family:var(--font-body)}.k{font-size:12px;color:var(--text-secondary)}.n{font-size:13px;font-weight:500}.w{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);height:170px}.c{background:var(--surface-card);padding:18px;display:flex;flex-direction:column;justify-content:space-between}.f{font-size:26px;font-weight:500;letter-spacing:-.025em;font-variant-numeric:tabular-nums}.f i{font-style:normal;font-size:.78em;opacity:.7;margin-right:1px}.d{display:flex;gap:6px;align-items:center}.d span{width:14px;height:14px;border-radius:4px}</style></head><body><div class="w">
<div class="c"><div class="n">Money in</div><div class="f" style="color:var(--money-in)">+<i>₦</i>4,500</div><div class="d"><span style="background:var(--green-600)"></span><span style="background:var(--green-50);box-shadow:inset 0 0 0 1px var(--line)"></span><em class="k" style="font-style:normal">green 600 / 50</em></div></div>
<div class="c"><div class="n">Money out</div><div class="f">−<i>₦</i>3,000</div><div class="d"><span style="background:var(--clay-600)"></span><span style="background:var(--clay-50);box-shadow:inset 0 0 0 1px var(--line)"></span><em class="k" style="font-style:normal">clay 600 / 50 — glyphs only</em></div></div>
<div class="c"><div class="n">Owed</div><div class="f" style="color:var(--money-owed)"><i>₦</i>6,500</div><div class="d"><span style="background:var(--ochre-600)"></span><span style="background:var(--ochre-50);box-shadow:inset 0 0 0 1px var(--line)"></span><em class="k" style="font-style:normal">ochre 600 / 50</em></div></div>
<div class="c"><div class="n">AI &amp; destructive</div><div class="f" style="font-size:15px;line-height:1.6"><span style="color:var(--iris-600)">SPAL AI — iris</span><br><span style="color:var(--danger)">Delete — red</span></div><div class="d"><span style="background:var(--iris-600)"></span><span style="background:var(--red-600)"></span><em class="k" style="font-style:normal">rare, purpose-bound</em></div></div>
</div>
