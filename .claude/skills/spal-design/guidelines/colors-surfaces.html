<html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--surface-app);color:var(--text-primary);font-family:var(--font-body)}.k{font-size:12px;color:var(--text-secondary)}.n{font-size:13px;font-weight:500}.w{height:200px;background:var(--paper);padding:20px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px}.p{border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:space-between}</style></head><body><div class="w">
<div class="p" style="background:var(--paper);box-shadow:inset 0 0 0 1px var(--line-strong);border-style:dashed"><div class="n">Paper · canvas</div><div class="k">#F6F6F1 — the app background. Warm, faintly green.</div></div>
<div style="display:grid;gap:14px"><div class="p" style="background:#fff;box-shadow:var(--shadow-1),var(--highlight-top)"><div class="n">Raised</div><div class="k">#FFFFFF + hairline ring</div></div><div class="p" style="background:var(--paper-sunken)"><div class="n">Sunken</div><div class="k">#EDEEE8 — wells, tracks</div></div></div>
<div class="p" style="background:var(--ink-900);color:#EEF1ED"><div class="n">Inverse</div><div class="k" style="color:rgba(238,241,237,.6)">ink 900 — toasts, quick menu, selected chips</div></div>
</div>
